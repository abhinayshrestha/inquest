# Reference pg_hba.conf for deploy/compose.yaml (D040, D041, docs/deployment.md). First
# match wins. Role names are the ones in the secrets files; adjust them together.
#
# TYPE      DATABASE  USER          ADDRESS            METHOD
# Inside the database container (initialisation, maintenance with docker exec).
local       all       all                              scram-sha-256
# The application's address may use the runtime role only, and only over TLS.
hostssl     inquest   inquest_app   172.30.20.3/32     scram-sha-256
host        all       all           172.30.20.3/32     reject
# One-off jobs on the data network (Docker's dynamic range): migration role (Alembic),
# administrative role (provisioning). In a managed database, the operator's job subnet.
hostssl     inquest   all           172.30.20.128/25   scram-sha-256
# Everything else, and anything without TLS, is refused.
host        all       all           all                reject
