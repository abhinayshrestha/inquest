# Reference hosted topology (D041, docs/deployment.md). Not a cloud deployment: one host
# running the TLS proxy, the backend and PostgreSQL on separate networks. Secrets come
# from files in INQUEST_SECRETS_DIR (default deploy/secrets, git-ignored), one file per
# process, so each process holds only its own:
#   app.env       runtime role, MCP token secret, sign-in client secret, credential keys
#   migrate.env   migration role (Alembic)
#   admin.env     administrative role and both role passwords (provisioning only)
#   postgres.env  administrative role for the database container's first start
#   tls/          proxy certificate (fullchain.pem, privkey.pem)
#   postgres/     database server certificate (server.crt, server.key) and ca.pem
#
#   docker compose -f deploy/compose.yaml build
#   docker compose -f deploy/compose.yaml up -d postgres
#   docker compose -f deploy/compose.yaml run --rm provision      # once, and after role changes
#   docker compose -f deploy/compose.yaml run --rm migrate        # every release
#   docker compose -f deploy/compose.yaml up -d app proxy
#
# Only the proxy publishes ports. The backend listens on its address in the private
# `app` network (reachable by the proxy alone) and serves MCP on its own loopback.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-database: &database
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: inquest
  DATABASE_ECHO: "false"
  LOG_LEVEL: INFO
  APP_ENV: production
  # TLS to PostgreSQL, verified against the deployment's CA (libpq reads these).
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /run/inquest/postgres-ca.pem

services:
  proxy:
    build: { context: .., dockerfile: deploy/proxy.Dockerfile }
    image: inquest-proxy
    <<: *hardening
    # The master binds 80/443 and switches to the nginx user for workers.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    environment:
      INQUEST_SERVER_NAME: ${INQUEST_SERVER_NAME:?public host name}
      INQUEST_UPSTREAM: 172.30.10.3:8000
    ports:
      - "${INQUEST_HTTP_PORT:-80}:80"
      - "${INQUEST_HTTPS_PORT:-443}:443"
    volumes:
      - ${INQUEST_SECRETS_DIR:-./secrets}/tls:/etc/nginx/tls:ro
    networks:
      edge: {}
      app: { ipv4_address: 172.30.10.2 }
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: { context: .., dockerfile: deploy/app.Dockerfile }
    image: inquest-app
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *database
      # The API listener: this container's address on the private app network only.
      INQUEST_LISTEN_HOST: 172.30.10.3
      INQUEST_LISTEN_PORT: "8000"
      # Exactly the proxy; it replaces X-Forwarded-For with the peer address.
      INQUEST_TRUSTED_PROXIES: '["172.30.10.2"]'
      INQUEST_GRACEFUL_SHUTDOWN_SECONDS: "30"
      # Loopback inside this container; never published, never routed.
      MCP_PORT: "8001"
    env_file: ${INQUEST_SECRETS_DIR:-./secrets}/app.env
    volumes:
      - ${INQUEST_SECRETS_DIR:-./secrets}/postgres/ca.pem:/run/inquest/postgres-ca.pem:ro
    networks:
      app: { ipv4_address: 172.30.10.3 }
      # Fixed: pg_hba.conf lets this address use the runtime role only.
      data: { ipv4_address: 172.30.20.3 }
      # Outbound only: Nebius, SigNoz, the identity provider.
      egress: {}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://172.30.10.3:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # SIGTERM: uvicorn stops accepting, the runner leaves running turns to recovery
    # (D036 leases), MCP stops last; past the grace period Docker kills it.
    stop_grace_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inquest
    env_file: ${INQUEST_SECRETS_DIR:-./secrets}/postgres.env
    # The server key must belong to the postgres user, which a mounted file cannot.
    entrypoint:
      - sh
      - -c
      - >-
        install -o postgres -g postgres -m 0600 /run/tls/server.key /var/lib/postgresql/server.key &&
        install -o postgres -g postgres -m 0644 /run/tls/server.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.2
        -c hba_file=/etc/inquest/pg_hba.conf
        -c password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/inquest/pg_hba.conf:ro
      - ${INQUEST_SECRETS_DIR:-./secrets}/postgres/server.crt:/run/tls/server.crt:ro
      - ${INQUEST_SECRETS_DIR:-./secrets}/postgres/server.key:/run/tls/server.key:ro
    networks:
      data: { ipv4_address: 172.30.20.2 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d inquest"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off jobs (profile "ops"): never running next to the API with their credentials.
  provision:
    image: inquest-app
    profiles: [ops]
    <<: *hardening
    read_only: true
    command: ["python", "-m", "scripts.provision_database", "--apply"]
    environment: *database
    env_file: ${INQUEST_SECRETS_DIR:-./secrets}/admin.env
    volumes:
      - ${INQUEST_SECRETS_DIR:-./secrets}/postgres/ca.pem:/run/inquest/postgres-ca.pem:ro
    networks: [data]

  migrate:
    image: inquest-app
    profiles: [ops]
    <<: *hardening
    read_only: true
    command: ["alembic", "upgrade", "head"]
    environment: *database
    env_file: ${INQUEST_SECRETS_DIR:-./secrets}/migrate.env
    volumes:
      - ${INQUEST_SECRETS_DIR:-./secrets}/postgres/ca.pem:/run/inquest/postgres-ca.pem:ro
    networks: [data]

networks:
  edge: {}
  # internal: no route out and no published ports; only the members can talk.
  # Fixed addresses below .128; Docker hands out only .128 and up (ip_range), so a
  # one-off job can never take the application's address.
  app:
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24, ip_range: 172.30.10.128/25 }] }
  data:
    internal: true
    ipam: { config: [{ subnet: 172.30.20.0/24, ip_range: 172.30.20.128/25 }] }
  egress: {}

volumes:
  pgdata: {}
