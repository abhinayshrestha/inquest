# Values come from .env (docker compose loads it automatically).
services:
  postgres:
    image: postgres:16
    container_name: inquest-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?set in .env}
    ports:
      - "${POSTGRES_PORT:?set in .env}:5432"
    volumes:
      - inquest-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local-only sign-in for trying Inquest without an identity provider account
  # (`docker compose --profile demo up -d`). Its login form accepts any username and
  # claims: never use it outside your own machine.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: inquest-oidc
    profiles: [demo]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true, "httpServer": "NettyWrapper"}'

volumes:
  inquest-pgdata:
